name: Build

# Every push and PR: test and bundle on all three platforms.
# Pushing a version tag (v0.2.0, ...) also publishes a GitHub Release with
# the zipped bundles. Asset names never change, so
#   https://github.com/ColemanSWE/formalin/releases/latest/download/Formalin-windows.zip
# always points at the newest release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

      - name: Bundle
        if: runner.os != 'macOS'
        run: cargo xtask bundle formalin --release

      # One bundle that runs on both Apple Silicon and Intel Macs.
      - name: Bundle (universal)
        if: runner.os == 'macOS'
        run: cargo xtask bundle-universal formalin --release

      - uses: actions/upload-artifact@v4
        with:
          name: formalin-${{ matrix.name }}
          path: target/bundled/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the bundles
        run: |
          mkdir dist
          for platform in windows macos linux; do
            (cd "artifacts/formalin-$platform" && zip -qr "../../dist/Formalin-$platform.zip" .)
          done
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Formalin $GITHUB_REF_NAME" \
            --generate-notes
