name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

      - name: Bundle
        if: runner.os != 'macOS'
        run: cargo xtask bundle formalin --release

      - name: Bundle (universal)
        if: runner.os == 'macOS'
        run: cargo xtask bundle-universal formalin --release

      - uses: actions/upload-artifact@v4
        with:
          name: formalin-${{ matrix.name }}
          path: target/bundled/
